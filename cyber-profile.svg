  <!-- ==================== WATERMARK ==================== -->
  <g id="watermark" opacity="0.04">
    <text x="600" y="395" font-family="JetBrains Mono, monospace" font-size="10" fill="#00D9FF" text-anchor="middle" letter-spacing="4">IKROM MAULANA // FULL STACK DEVELOPER</text>
  </g>
</svg>