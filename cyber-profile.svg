<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0A0F17"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>

    <!-- Hologram Gradient -->
    <linearGradient id="hologramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 217, 255, 0.15)"/>
      <stop offset="50%" stop-color="rgba(91, 140, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(124, 92, 252, 0.1)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Holographic Glow -->
    <filter id="hologramGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="rgba(0, 217, 255, 0.08)" stroke-width="1"/>
    </pattern>

    <!-- Horizontal Scan Pattern -->
    <pattern id="hScan" width="1200" height="8" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="rgba(0, 217, 255, 0.03)"/>
      <rect y="7" width="1200" height="1" fill="rgba(124, 92, 252, 0.02)"/>
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 217, 255, 0.04)" stroke-width="0.5"/>
      <circle cx="30" cy="30" r="1" fill="rgba(0, 217, 255, 0.06)"/>
    </pattern>

    <!-- Tech Corner Pattern -->
    <pattern id="cornerDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.8" fill="rgba(0, 217, 255, 0.08)"/>
    </pattern>

    <!-- Clip Path for Avatar -->
    <clipPath id="avatarClip">
      <circle cx="120" cy="210" r="75"/>
    </clipPath>

    <!-- Clip Path for Inner Hologram -->
    <clipPath id="hologramClip">
      <circle cx="120" cy="210" r="68"/>
    </clipPath>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <g id="background">
    <rect width="1200" height="420" rx="16" ry="16" fill="url(#bgGrad)"/>
    <rect width="1200" height="420" rx="16" ry="16" fill="url(#grid)"/>
    <rect width="1200" height="420" rx="16" ry="16" fill="url(#scanlines)"/>
    <rect width="1200" height="420" rx="16" ry="16" fill="url(#cornerDots)"/>
    <rect width="1200" height="420" rx="16" ry="16" fill="none" stroke="rgba(0, 217, 255, 0.04)" stroke-width="1"/>
  </g>

  <!-- ==================== CORNER BORDERS ==================== -->
  <g id="borders" opacity="0.5">
    <!-- Top Left -->
    <path d="M 25 40 L 25 25 L 40 25" fill="none" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="2" fill="#00D9FF" opacity="0.4"/>
    
    <!-- Top Right -->
    <path d="M 1175 25 L 1160 25 L 1160 40" fill="none" stroke="#7C5CFC" stroke-width="1.5"/>
    <circle cx="1160" cy="25" r="2" fill="#7C5CFC" opacity="0.4"/>
    
    <!-- Bottom Left -->
    <path d="M 25 380 L 25 395 L 40 395" fill="none" stroke="#00D9FF" stroke-width="1.5"/>
    <circle cx="25" cy="395" r="2" fill="#00D9FF" opacity="0.4"/>
    
    <!-- Bottom Right -->
    <path d="M 1175 395 L 1160 395 L 1160 380" fill="none" stroke="#7C5CFC" stroke-width="1.5"/>
    <circle cx="1160" cy="395" r="2" fill="#7C5CFC" opacity="0.4"/>
  </g>

  <!-- ==================== TOP LINE ==================== -->
  <g id="top-line" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2"/>
  </g>

  <!-- ==================== HOLOGRAM AVATAR ==================== -->
  <g id="avatar-hologram">
    <!-- Outer Holographic Glow -->
    <circle cx="120" cy="210" r="95" fill="none" stroke="rgba(0, 217, 255, 0.05)" stroke-width="0.5" filter="url(#hologramGlow)"/>

    <!-- Main Avatar Circle Frame -->
    <circle cx="120" cy="210" r="78" fill="rgba(0, 217, 255, 0.02)" stroke="rgba(0, 217, 255, 0.2)" stroke-width="1.5"/>

    <!-- Inner Technical Frame -->
    <circle cx="120" cy="210" r="73" fill="none" stroke="rgba(0, 217, 255, 0.08)" stroke-width="0.5" stroke-dasharray="4 4"/>

    <!-- ============================================================ -->
    <!-- AVATAR IMAGE - REPLACE avatar.png WITH YOUR PHOTO            -->
    <!-- ============================================================ -->
    <image href="avatar.png" x="45" y="135" width="150" height="150" clip-path="url(#avatarClip)" opacity="0.7"/>

    <!-- Holographic Overlay -->
    <circle cx="120" cy="210" r="75" fill="url(#hologramGrad)" clip-path="url(#hologramClip)"/>

    <!-- Horizontal Scanlines Overlay -->
    <rect x="45" y="135" width="150" height="150" fill="url(#hScan)" clip-path="url(#hologramClip)">
      <animate attributeName="y" values="0;150" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Moving Scan Line -->
    <line x1="45" y1="210" x2="195" y2="210" stroke="rgba(0, 217, 255, 0.3)" stroke-width="1" clip-path="url(#hologramClip)">
      <animate attributeName="y1" values="135;285" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="135;285" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- Subtle Glow Pulse -->
    <circle cx="120" cy="210" r="75" fill="none" stroke="rgba(0, 217, 255, 0.15)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Frame Corner Decorations -->
    <g stroke="rgba(0, 217, 255, 0.4)" stroke-width="1.5" fill="none">
      <path d="M 45 145 L 45 135 L 55 135"/>
      <path d="M 195 135 L 185 135 L 185 145"/>
      <path d="M 45 275 L 45 285 L 55 285"/>
      <path d="M 195 285 L 185 285 L 185 275"/>
    </g>

    <!-- Corner Dots -->
    <circle cx="45" cy="135" r="2" fill="#00D9FF" opacity="0.5"/>
    <circle cx="195" cy="135" r="2" fill="#7C5CFC" opacity="0.5"/>
    <circle cx="45" cy="285" r="2" fill="#7C5CFC" opacity="0.5"/>
    <circle cx="195" cy="285" r="2" fill="#00D9FF" opacity="0.5"/>

    <!-- HUD Labels Around Portrait -->
    <text x="120" y="110" font-family="JetBrains Mono, monospace" font-size="8" fill="#00D9FF" text-anchor="middle" opacity="0.5" letter-spacing="2">IDENTITY SCAN</text>
    <text x="15" y="200" font-family="JetBrains Mono, monospace" font-size="7" fill="#5B8CFF" opacity="0.4" letter-spacing="1">ID: IKROM</text>
    <text x="15" y="215" font-family="JetBrains Mono, monospace" font-size="7" fill="#5B8CFF" opacity="0.3" letter-spacing="1">DEV: 001</text>
    <text x="205" y="200" font-family="JetBrains Mono, monospace" font-size="7" fill="#00D9FF" text-anchor="end" opacity="0.4" letter-spacing="1">STATUS: ONLINE</text>
    <text x="205" y="215" font-family="JetBrains Mono, monospace" font-size="7" fill="#00D9FF" text-anchor="end" opacity="0.3" letter-spacing="1">SEC: AUTH</text>

    <!-- Bottom Status Dot -->
    <circle cx="120" cy="300" r="3" fill="#22C55E" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="120" y="312" font-family="JetBrains Mono, monospace" font-size="7" fill="#22C55E" text-anchor="middle" opacity="0.5" letter-spacing="1">LIVE</text>

    <!-- Decorative Circuit Lines -->
    <path d="M 55 130 L 55 115 L 70 115" fill="none" stroke="rgba(0, 217, 255, 0.15)" stroke-width="0.5"/>
    <path d="M 185 130 L 185 115 L 170 115" fill="none" stroke="rgba(124, 92, 252, 0.15)" stroke-width="0.5"/>
    <path d="M 55 290 L 55 305 L 70 305" fill="none" stroke="rgba(124, 92, 252, 0.15)" stroke-width="0.5"/>
    <path d="M 185 290 L 185 305 L 170 305" fill="none" stroke="rgba(0, 217, 255, 0.15)" stroke-width="0.5"/>
    <circle cx="55" cy="115" r="1.5" fill="rgba(0, 217, 255, 0.3)"/>
    <circle cx="185" cy="115" r="1.5" fill="rgba(124, 92, 252, 0.3)"/>
    <circle cx="55" cy="305" r="1.5" fill="rgba(124, 92, 252, 0.3)"/>
    <circle cx="185" cy="305" r="1.5" fill="rgba(0, 217, 255, 0.3)"/>
  </g>

  <!-- ==================== IDENTITY SECTION ==================== -->
  <g id="identity">
    <text x="240" y="185" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#F8FAFC" letter-spacing="3">
      IKROM MAULANA
    </text>
    <text x="240" y="225" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#00D9FF" letter-spacing="4" opacity="0.9">
      FULL STACK DEVELOPER
    </text>
    <text x="240" y="252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8" letter-spacing="2" opacity="0.7">
      WEB &amp; BACKEND ENGINEERING
    </text>

    <!-- Tech Tags -->
    <g transform="translate(240, 275)">
      <rect x="0" y="0" width="80" height="24" rx="12" fill="rgba(0, 217, 255, 0.06)" stroke="rgba(0, 217, 255, 0.15)" stroke-width="0.5"/>
      <text x="40" y="16" font-family="JetBrains Mono, monospace" font-size="9" fill="#00D9FF" text-anchor="middle" letter-spacing="1">PYTHON</text>

      <rect x="88" y="0" width="80" height="24" rx="12" fill="rgba(91, 140, 255, 0.06)" stroke="rgba(91, 140, 255, 0.15)" stroke-width="0.5"/>
      <text x="128" y="16" font-family="JetBrains Mono, monospace" font-size="9" fill="#5B8CFF" text-anchor="middle" letter-spacing="1">JS</text>

      <rect x="176" y="0" width="80" height="24" rx="12" fill="rgba(124, 92, 252, 0.06)" stroke="rgba(124, 92, 252, 0.15)" stroke-width="0.5"/>
      <text x="216" y="16" font-family="JetBrains Mono, monospace" font-size="9" fill="#7C5CFC" text-anchor="middle" letter-spacing="1">LINUX</text>

      <rect x="264" y="0" width="80" height="24" rx="12" fill="rgba(0, 217, 255, 0.06)" stroke="rgba(0, 217, 255, 0.15)" stroke-width="0.5"/>
      <text x="304" y="16" font-family="JetBrains Mono, monospace" font-size="9" fill="#00D9FF" text-anchor="middle" letter-spacing="1">NET</text>

      <rect x="352" y="0" width="80" height="24" rx="12" fill="rgba(91, 140, 255, 0.06)" stroke="rgba(91, 140, 255, 0.15)" stroke-width="0.5"/>
      <text x="392" y="16" font-family="JetBrains Mono, monospace" font-size="9" fill="#5B8CFF" text-anchor="middle" letter-spacing="1">MIKROTIK</text>

      <rect x="440" y="0" width="80" height="24" rx="12" fill="rgba(124, 92, 252, 0.06)" stroke="rgba(124, 92, 252, 0.15)" stroke-width="0.5"/>
      <text x="480" y="16" font-family="JetBrains Mono, monospace" font-size="9" fill="#7C5CFC" text-anchor="middle" letter-spacing="1">BACKEND</text>
    </g>
  </g>

  <!-- ==================== SYSTEM PANEL ==================== -->
  <g id="system-panel" transform="translate(840, 120)">
    <rect x="0" y="0" width="280" height="200" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="rgba(0, 217, 255, 0.08)" stroke-width="0.5"/>
    <rect x="0" y="0" width="280" height="200" rx="12" fill="none" stroke="rgba(0, 217, 255, 0.03)" stroke-width="1"/>

    <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="11" fill="#00D9FF" letter-spacing="2" opacity="0.8">SYSTEM // STATUS</text>
    <line x1="20" y1="40" x2="260" y2="40" stroke="rgba(0, 217, 255, 0.06)" stroke-width="0.5"/>

    <g transform="translate(20, 60)">
      <circle cx="0" cy="0" r="4" fill="#22C55E" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="15" y="4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#F8FAFC" letter-spacing="1">ONLINE</text>
      <text x="120" y="4" font-family="JetBrains Mono, monospace" font-size="9" fill="#94A3B8" letter-spacing="1">● ACTIVE</text>
    </g>

    <g transform="translate(20, 90)">
      <circle cx="0" cy="0" r="4" fill="#00D9FF" filter="url(#glow)"/>
      <text x="15" y="4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#F8FAFC" letter-spacing="1">NETWORK</text>
      <text x="120" y="4" font-family="JetBrains Mono, monospace" font-size="9" fill="#94A3B8" letter-spacing="1">● CONNECTED</text>
    </g>

    <g transform="translate(20, 120)">
      <circle cx="0" cy="0" r="4" fill="#7C5CFC" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="15" y="4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#F8FAFC" letter-spacing="1">DEVELOPMENT</text>
      <text x="120" y="4" font-family="JetBrains Mono, monospace" font-size="9" fill="#94A3B8" letter-spacing="1">● RUNNING</text>
    </g>

    <g transform="translate(20, 150)">
      <circle cx="0" cy="0" r="4" fill="#5B8CFF" filter="url(#glow)"/>
      <text x="15" y="4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#F8FAFC" letter-spacing="1">SERVER</text>
      <text x="120" y="4" font-family="JetBrains Mono, monospace" font-size="9" fill="#94A3B8" letter-spacing="1">● READY</text>
    </g>

    <line x1="20" y1="175" x2="260" y2="175" stroke="rgba(0, 217, 255, 0.04)" stroke-width="0.5"/>
    <text x="20" y="190" font-family="JetBrains Mono, monospace" font-size="8" fill="#94A3B8" opacity="0.5" letter-spacing="1">UPTIME: 99.98%</text>
    <text x="140" y="190" font-family="JetBrains Mono, monospace" font-size="8" fill="#94A3B8" opacity="0.5" letter-spacing="1">PING: 12ms</text>
    <text x="220" y="190" font-family="JetBrains Mono, monospace" font-size="8" fill="#94A3B8" opacity="0.5" letter-spacing="1">v2.4.1</text>
  </g>

  <!-- ==================== ASCII ART SECTION ==================== -->
  <g id="ascii-art" transform="translate(120, 355)">
    <text font-family="JetBrains Mono, monospace" font-size="7" fill="#00D9FF" opacity="0.2" letter-spacing="1.5">
      <tspan x="0" y="0">╔══════════════════════════════════════════════════════════╗</tspan>
      <tspan x="0" y="12">║  ██╗██╗  ██╗██████╗  ██████╗ ███╗   ███╗              ║</tspan>
      <tspan x="0" y="24">║  ██║██║  ██║██╔══██╗██╔═══██╗████╗ ████║              ║</tspan>
      <tspan x="0" y="36">║  ██║███████║██████╔╝██║   ██║██╔████╔██║              ║</tspan>
      <tspan x="0" y="48">║  ██║██╔══██║██╔══██╗██║   ██║██║╚██╔╝██║              ║</tspan>
      <tspan x="0" y="60">║  ██║██║  ██║██║  ██║╚██████╔╝██║ ╚═╝ ██║              ║</tspan>
      <tspan x="0" y="72">║  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝ ╚═╝     ╚═╝              ║</tspan>
      <tspan x="0" y="84">╚══════════════════════════════════════════════════════════╝</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM TECH BAR ==================== -->
  <g id="bottom-bar" transform="translate(0, 380)">
    <rect x="0" y="0" width="1200" height="30" fill="rgba(0, 0, 0, 0.3)"/>

    <text x="30" y="20" font-family="JetBrains Mono, monospace" font-size="9" fill="#00D9FF" opacity="0.35" letter-spacing="2">01 // FULL STACK</text>
    <text x="230" y="20" font-family="JetBrains Mono, monospace" font-size="9" fill="#5B8CFF" opacity="0.35" letter-spacing="2">02 // PYTHON</text>
    <text x="430" y="20" font-family="JetBrains Mono, monospace" font-size="9" fill="#7C5CFC" opacity="0.35" letter-spacing="2">03 // WEB</text>
    <text x="630" y="20" font-family="JetBrains Mono, monospace" font-size="9" fill="#00D9FF" opacity="0.35" letter-spacing="2">04 // NETWORK</text>
    <text x="830" y="20" font-family="JetBrains Mono, monospace" font-size="9" fill="#5B8CFF" opacity="0.35" letter-spacing="2">05 // LINUX</text>
    <text x="1030" y="20" font-family="JetBrains Mono, monospace" font-size="9" fill="#7C5CFC" opacity="0.35" letter-spacing="2">06 // MIKROTIK</text>

    <circle cx="210" cy="15" r="1" fill="rgba(0, 217, 255, 0.1)"/>
    <circle cx="410" cy="15" r="1" fill="rgba(91, 140, 255, 0.1)"/>
    <circle cx="610" cy="15" r="1" fill="rgba(124, 92, 252, 0.1)"/>
    <circle cx="810" cy="15" r="1" fill="rgba(0, 217, 255, 0.1)"/>
    <circle cx="1010" cy="15" r="1" fill="rgba(91, 140, 255, 0.1)"/>
  </g>

  <!-- ==================== DECORATIVE ELEMENTS ==================== -->
  <g id="decorations" opacity="0.25">
    <path d="M 120 380 L 120 350 L 180 350" fill="none" stroke="rgba(0, 217, 255, 0.15)" stroke-width="0.5"/>
    <circle cx="180" cy="350" r="1.5" fill="#00D9FF" opacity="0.5"/>

    <path d="M 1080 380 L 1080 350 L 1020 350" fill="none" stroke="rgba(124, 92, 252, 0.15)" stroke-width="0.5"/>
    <circle cx="1020" cy="350" r="1.5" fill="#7C5CFC" opacity="0.5"/>

    <text x="30" y="370" font-family="JetBrains Mono, monospace" font-size="8" fill="#94A3B8" opacity="0.25" letter-spacing="1">LAT: -6.2088°</text>
    <text x="150" y="370" font-family="JetBrains Mono, monospace" font-size="8" fill="#94A3B8" opacity="0.25" letter-spacing="1">LNG: 106.8456°</text>
    <text x="1050" y="370" font-family="JetBrains Mono, monospace" font-size="8" fill="#94A3B8" opacity="0.25" letter-spacing="1">TZ: UTC+7</text>

    <path d="M 900 370 L 920 365 L 940 368 L 960 360 L 980 365 L 1000 362" fill="none" stroke="rgba(0, 217, 255, 0.1)" stroke-width="1">
      <animate attributeName="d" values="
